# Cloudflare Pages project "margin-words" (https://inputread.site).
# There is no Git integration. The owner deploys the built site by hand.
# Leave VITE_BOOKS_BASE unset (npm run build). Do not deploy a build:local folder.
# Do not upload dist-books/, packs/, or dist-private/ with this command:
#   npm run build
#   npx wrangler pages deploy dist --project-name margin-words --branch main
# Pages Functions in ./functions are uploaded with that deploy. This file is not
# applied by itself; `pages deploy` reads it for the D1 binding.
#
# database_id is the live D1 database "margin-words" (already created, migration
# 0001 applied). It names the database. It is not a key or a token. Reading it
# still needs a Cloudflare login. Do not create a second database. Local
# `wrangler pages dev` still uses a local D1. Do not point this binding at R2.
# Book files stay on books.inputread.site. Do not put API tokens or the
# Turnstile secret in this file.

name = "margin-words"
compatibility_date = "2026-10-02"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "margin-words"
database_id = "c286e644-2ead-438c-bb65-70ee028d957a"
migrations_dir = "migrations"

# Public books host bucket (word-lists, public-books catalogs and files).
# Read by the admin word-list publisher through the BOOKS binding.
[[r2_buckets]]
binding = "BOOKS"
bucket_name = "margin-words-books"

# Copyrighted EPUBs. No public access. Streamed only to trusted accounts
# through /api/book/<id>/epub, which logs every download.
[[r2_buckets]]
binding = "PRIVATE"
bucket_name = "margin-words-private"
