<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>inputread</title>
    <meta
      name="description"
      content="Read English books. Tap a word to see a simple English meaning. Save it, then review it again and again."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <script>
      document.documentElement.setAttribute("data-js","");
      try{var p=JSON.parse(localStorage.getItem("cibian-prefs-v1")||"{}");var t=p.state&&p.state.theme;if(t==="dark"||t==="sepia"||t==="light"||t==="clear")document.documentElement.setAttribute("data-theme",t)}catch(e){}
      try{if(window.fetch)fetch("/admin",{cache:"reload"}).catch(function(){});}catch(e){}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>inputread needs JavaScript to run.</noscript>
    <!--
      Shown only when nothing has mounted after 12s, so a browser that cannot run the app says so
      instead of staying white. The style is inline: the stylesheet may be the thing that failed.
      The Kindle browser is the reason this exists - it ignores module scripts, and if its engine
      still cannot run the older build there is nothing else to look at.
    -->
    <div
      id="boot-help"
      hidden
      style="position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px; border-top: 1px solid #ccc; background: #fff; color: #111; font: 14px/1.5 -apple-system, 'Segoe UI', Arial, sans-serif; z-index: 9999"
    >
      <b>The reader is not working in this browser.</b> Please try a newer browser or another
      device. If you are reading on an e-reader, this line tells us why:
      <code id="boot-ua" style="display: block; margin-top: 6px; word-break: break-all; color: #555"></code>
    </div>
    <script>
      /* ES5 on purpose: the oldest engine that gets this far must run it. */
      (function () {
        var root = document.getElementById("root");
        var box = document.getElementById("boot-help");
        var line = document.getElementById("boot-ua");
        if (!root || !box) return;
        // Why it did not start is the one thing a reader cannot tell us from a photo of the
        // screen, so the notice carries it: the newest errors, and any file that never loaded.
        var seen = [];
        var noted = false;
        var tried = false;
        function record(text) {
          if (text && seen.length < 3) seen.push(String(text));
        }
        // The build puts a plain-HTML introduction for search engines in #root (scripts/seo-plugin.mjs).
        // React replaces it when the app mounts, so "mounted" means it is gone.
        function mounted() {
          return root.childNodes.length > 0 && !document.getElementById("seo-intro");
        }

        /**
         * A page from an older deploy names chunks that no longer exist, so nothing can start.
         * Reloading is the cure, and a DIFFERENT URL is what makes the browser ask the server
         * instead of its own cache: the address stays, only a query string is added. Once per
         * 30 seconds - a deploy that is genuinely broken shows the notice rather than a loop.
         */
        function recover() {
          if (tried || mounted()) return false;
          tried = true;
          try {
            var last = Number(sessionStorage.getItem("mw-boot-retry") || "0");
            if (Date.now() - last < 30000) return false;
            sessionStorage.setItem("mw-boot-retry", String(Date.now()));
          } catch (e) {
            return false;
          }
          var go = function () {
            var url = location.pathname + location.search;
            url += (url.indexOf("?") === -1 ? "?" : "&") + "r=" + Date.now();
            location.replace(url);
          };
          // An old service worker could answer the reload with the same stale page: step away
          // from it first. It is a no-op worker, so unregistering costs nothing.
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then(function (list) {
                for (var i = 0; i < list.length; i += 1) list[i].unregister();
                go();
              }, go);
            } else {
              go();
            }
          } catch (e) {
            go();
          }
          return true;
        }

        window.onerror = function (message, source, lineno) {
          record(message + " (" + String(source || "").split("/").pop() + ":" + lineno + ")");
        };
        // A missing or blocked file fires on the element, not on window.onerror.
        window.addEventListener(
          "error",
          function (event) {
            var el = event && event.target;
            if (!el || el === window || !el.tagName) return;
            var src = el.src || el.href || "";
            record("could not load " + (src || el.tagName));
            if (/\/assets\/[^/]*\.js(\?|$)/.test(src)) recover();
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event && event.reason;
          var text = (reason && reason.message) || reason;
          record("promise: " + text);
          if (/dynamically imported module|module script|Importing a module/i.test(String(text))) recover();
        });
        function show(text) {
          if (line) line.textContent = text;
          box.hidden = false;
        }
        // The app uses this when it knows it is stuck (for example a start that never finishes).
        window.__mwNote = function (text) {
          noted = true;
          record(text);
          show(navigator.userAgent + " | " + seen.join(" | "));
        };
        setTimeout(function () {
          if (mounted() || !box.hidden) return;
          // A chunk that never arrived means a page from an older deploy: one reload first.
          if (recover()) return;
          show(navigator.userAgent + (seen.length ? " | " + seen.join(" | ") : ""));
        }, 12000);
        setTimeout(function () {
          if (mounted() && !noted) box.hidden = true;
        }, 20000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
